# ---------------------------------------------------------------------------
# WMT16 English -> Romanian : default configuration
# ---------------------------------------------------------------------------
# Data, model and both training-stage settings live here.
#
# THE LENGTH NUMBERS BELOW ARE PROVISIONAL. They were not measured; they are
# placeholders so the pipeline runs end to end. Run
# `python scripts/analyze_lengths.py` and set them from the real p95/p99/max
# before you train anything you intend to report. See README section
# "Length-analysis workflow".
# ---------------------------------------------------------------------------

dataset:
    name: wmt16
    config: ro-en
    source_language: en
    target_language: ro
    # Hugging Face cache location. null = the default (~/.cache/huggingface).
    cache_dir: null
    # Processes for Dataset.map(). 1 is the safe default on Windows: >1 spawns
    # fresh interpreters that must pickle the tokenizers.
    num_proc: 1

source_tokenizer:
    # CASED on purpose. Capitalization carries translation information
    # ("Apple" != "apple", "May" != "may", "US" != "us") and the encoder this
    # feeds is the same checkpoint. Loading an uncased name is rejected
    # loudly by dataset/source_tokenizer.py rather than silently accepted.
    name: google-bert/bert-base-cased

model:
    # Must match the BERT encoder's hidden size for cross-attention.
    dim: 768
    group: 12
    decoder_layers: 6
    dropout: 0.1
    norm: pre
    max_target_positions: 512

target_tokenizer:
    type: sentencepiece
    model_type: bpe
    vocab_size: 16000
    # Case-PRESERVING normalization. nmt_nfkc_cf is the case-folding variant
    # and is rejected by utils/config.py: "Romania" and "romania" must stay
    # distinct, and the diacritics a ^a ^i s t must survive.
    normalization_rule_name: nmt_nfkc
    lowercase: false
    # 1.0 for a Latin-script language: cover every character in the corpus.
    character_coverage: 1.0
    # 0 = train on every TRAIN sentence. Lower it (e.g. 2000000) only if BPE
    # training is too slow or too memory-hungry on your machine.
    input_sentence_size: 0
    shuffle_input_sentence: true
    model_prefix: spm_ro

lengths:
    # PROVISIONAL -- confirm with scripts/analyze_lengths.py.
    # Source length COUNTS [CLS] and [SEP].
    max_train_source_length: 128
    # Target length COUNTS <bos> and <eos> (the full teacher-forcing sequence;
    # decoder_input_ids and labels are one shorter).
    max_train_target_length: 128
    # "filter" = drop the whole pair. This is the only supported value;
    # "truncate" is rejected on purpose, see README "Why naive truncation is
    # dangerous in MT".
    long_train_pair_policy: filter
    # What to do when an official validation/test pair exceeds the limits
    # below: "error" = refuse to run, "warn" = report loudly and keep going.
    # Never silently drop or truncate a benchmark example.
    evaluation_overlength_policy: error
    # Hard architectural ceiling of the planned encoder: bert-base has 512
    # positional embeddings. A source longer than this cannot be encoded at
    # all, whatever the training limits say.
    max_source_positions: 512
    # Cached official validation: max 176 incl. BOS/EOS; 4 rows exceed 128.
    # Keep the full validation set; training filtering remains at 128.
    max_eval_target_length: 256

training:
    seed: 42
    device: auto            # auto -> cuda > mps > cpu; or "cuda" / "cpu" / "mps"
    batch_size: 32
    eval_batch_size: 32
    num_workers: 0          # 0 avoids Windows worker spawn cost
    grad_clip: 1.0
    mixed_precision: true   # bf16 when the GPU supports it, else fp16 + GradScaler
    log_every: 100          # updates between progress lines
    # The stage placeholder keeps stage 2 from overwriting stage 1.
    output_dir: outputs_stage{stage}

# Stage 1: the pretrained encoder is frozen; only the randomly initialized
# target-side parameters learn. One learning rate, because every trainable
# tensor is random.
stage1:
    freeze_encoder: true
    decoder_lr: 3.0e-4
    epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    label_smoothing: 0.1

# Stage 2: unfreeze BERT and fine-tune jointly. The encoder moves ~5x slower
# than the decoder side: it already knows English, the decoder side does not
# yet know Romanian.
stage2:
    freeze_encoder: false
    encoder_lr: 2.0e-5
    decoder_lr: 1.0e-4
    epochs: 5
    warmup_ratio: 0.05
    weight_decay: 0.01
    label_smoothing: 0.1

evaluation:
    metrics:
        - sacrebleu
        - chrf
    # chrF++ = chrF with word_order 2. Set 0 for plain chrF.
    chrf_word_order: 2

# Decoding settings for evaluate.py (greedy or beam search).
generation:
    # Includes a generated EOS, excludes the initial BOS.
    max_new_tokens: 256
    num_beams: 4
    # Beam score = sum(log probabilities) / generated_length ** length_penalty.
    length_penalty: 1.0

paths:
    # All relative to the project root (the folder holding this project's
    # train.py), resolved by utils/config.py.
    artifacts_dir: artifacts
    target_tokenizer_dir: artifacts/tokenizer_ro
    dataset_stats_path: artifacts/dataset_stats.json
